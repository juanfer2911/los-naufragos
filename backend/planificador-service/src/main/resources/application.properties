server.port=${SERVER_PORT:8081}
spring.datasource.url=${PLANIFICADOR_DB_URL:jdbc:postgresql://localhost:5432/planificador_db}
spring.datasource.username=${PLANIFICADOR_DB_USER:planificador_user}
spring.datasource.password=${PLANIFICADOR_DB_PASSWORD}
spring.sql.init.mode=always
spring.jackson.deserialization.accept-float-as-int=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/planificador-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/planificador-realm/protocol/openid-connect/certs}
planificador.jwt.audience=${KEYCLOAK_AUDIENCE:planificador-service}
planificador.cors.origins=${FRONTEND_ORIGINS:http://localhost:4200}
planificador.biblioteca=${PLANIFICADOR_BIBLIOTECA:}
