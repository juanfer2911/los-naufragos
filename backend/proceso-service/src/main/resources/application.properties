server.port=${SERVER_PORT:8082}
spring.datasource.url=${PROCESO_DB_URL:jdbc:postgresql://localhost:5432/proceso_db}
spring.datasource.username=${PROCESO_DB_USER:proceso_user}
spring.datasource.password=${PROCESO_DB_PASSWORD}
spring.sql.init.mode=always
spring.jackson.deserialization.accept-float-as-int=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/planificador-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/planificador-realm/protocol/openid-connect/certs}
proceso.jwt.audience=${KEYCLOAK_AUDIENCE:proceso-service}
proceso.cors.origins=${FRONTEND_ORIGINS:http://localhost:4200}
